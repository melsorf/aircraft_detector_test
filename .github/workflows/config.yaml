name: CI

on:
  pull_request:

  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04

    env:
      BUILD_DIR: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            protobuf-compiler \
            libprotobuf-dev \
            libprotoc-dev \
            libgtest-dev \
            libyaml-cpp-dev

      - name: Configure
        run: |
          cmake \
            -S . \
            -B "${BUILD_DIR}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DBUILD_AIRCRAFT_DETECTOR=OFF

      - name: Build
        run: |
          cmake \
            --build "${BUILD_DIR}" \
            --parallel

      - name: Run unit tests
        run: |
          ctest \
            --test-dir "${BUILD_DIR}" \
            --output-on-failure